<svg width="600" height="240" viewBox="0 0 360 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="background: #0b0518;">
    <defs>
        <!-- 高燃金漸層 -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE57F" />
            <stop offset="50%" stop-color="#FFD700" />
            <stop offset="100%" stop-color="#B8860B" />
        </linearGradient>
        <!-- 幻境紫發光效果 -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- 無限符號 × 聲波組合軌跡 -->
    <g filter="url(#glow)">
        <!-- 背景無限符號光軌 -->
        <path d="M 75,60 C 48,25 12,25 12,60 C 12,95 48,95 75,60 C 102,25 138,25 138,60 C 138,95 102,95 75,60 Z" 
              stroke="url(#goldGradient)" stroke-width="3.5" fill="none" opacity="0.45" stroke-dasharray="5 3"/>
        
        <!-- 核心聲波律動條 -->
        <rect x="73.5" y="42" width="3.5" height="36" rx="1.75" fill="url(#goldGradient)" />
        <rect x="66.5" y="48" width="3.5" height="24" rx="1.75" fill="url(#goldGradient)" />
        <rect x="80.5" y="46" width="3.5" height="28" rx="1.75" fill="url(#goldGradient)" />
        <rect x="59.5" y="53" width="3.5" height="14" rx="1.75" fill="url(#goldGradient)" opacity="0.75"/>
        <rect x="87.5" y="52" width="3.5" height="16" rx="1.75" fill="url(#goldGradient)" opacity="0.75"/>
    </g>

    <!-- 正式品牌標準字：幻境配樂 -->
    <text x="160" y="64" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="900" font-size="32" fill="url(#goldGradient)" letter-spacing="4">
        幻境配樂
    </text>
    
    <!-- 官方英文副標：MIRAGE CINEMATIC BGM -->
    <text x="162" y="82" font-family="'Montserrat', Arial, sans-serif" font-weight="600" font-size="9.5" fill="#A48FFF" letter-spacing="2">
        MIRAGE CINEMATIC BGM
    </text>
</svg>
