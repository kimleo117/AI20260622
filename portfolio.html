<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090d16; color: #f8fafc; font-family: "Noto Sans TC", sans-serif;

  /* 頂部 Header */
  header {

  }
  .logo-badge {

  .btn-nav:hover { background: #2563eb; border-color: #38bdf8; transform: translateY(-1px); }
  .btn-line { background: #06c755; border-color: #06c755; color: #ffffff; }
  .btn-line:hover { background: #05a847; border-color: #05a847; }

  /* 主作品集畫廊區 (置中與適應各螢幕) */
  main {
    flex-grow: 1; display: flex; flex-direction: column; align-items: center;
    padding: 20px 12px 90px 12px; max-width: 1000px; margin: 0 auto; width: 100%;
  }

  .viewer-container {
    position: relative; width: 100%; display: flex; justify-content: center; align-items: center;
    margin-bottom: 20px; touch-action: pan-y pinch-zoom;

  .page-card {

  }
  .page-img {
    width: 100%; height: auto; display: block; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }

  /* 底部浮動快速導航控制列 */
  .floating-controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
    border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 35px; padding: 8px 18px;
    display: flex; align-items: center; gap: 14px; z-index: 100;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.2);

  .btn-ctrl {
    background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; color: #ffffff;

  /* 目錄選單抽屜 (Drawer Modal) */
  .menu-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px); z-index: 200; padding: 20px;
    justify-content: center; align-items: center;
  }
  .modal-content {
    background: #0f172a; border: 1.5px solid rgba(56, 189, 248, 0.3); border-radius: 24px;

  }

    background: #2563eb; border-color: #38bdf8; color: #ffffff; transform: translateX(4px);

</style>

    { index: 44, title: "44. 國際證照 ‧ Adobe Photoshop CC 官方國際專業證照", file: "images/page_44.png?v=20261127" },

  ];

  let currentIndex = 0;
  const pageImage = document.getElementById('pageImage');
  const pageIndicator = document.getElementById('pageIndicator');
  const menuList = document.getElementById('menuList');
  const menuModal = document.getElementById('menuModal');
  const pageCard = document.getElementById('pageCard');

  function renderPage(idx) {
    if (idx < 0 || idx >= pages.length) return;
    currentIndex = idx;
    
    // 淡入淡出轉場效果
    pageCard.style.opacity = '0.3';
    setTimeout(() => {
      pageImage.src = pages[currentIndex].file;
      const numStr = (currentIndex + 1 < 10 ? '0' : '') + (currentIndex + 1);
      pageIndicator.innerText = `第 ${numStr} / ${pages.length} 頁`;
      pageCard.style.opacity = '1';
    }, 150);

    // 更新目錄高亮
    document.querySelectorAll('.menu-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentIndex);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function prevPage() {
    if (currentIndex > 0) renderPage(currentIndex - 1);
  }

  function nextPage() {
    if (currentIndex < pages.length - 1) renderPage(currentIndex + 1);
  }

  function toggleMenu() {
    menuModal.style.display = (menuModal.style.display === 'flex') ? 'none' : 'flex';
  }

  // 鍵盤左右鍵與空白鍵翻頁
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
  });

  // 手機觸控左右滑動支援 (Swipe gesture)
  let touchStartX = 0;
  let touchEndX = 0;
  const viewerContainer = document.getElementById('viewerContainer');

  viewerContainer.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  viewerContainer.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > 45) {
      if (diff < 0) nextPage();
      else prevPage();
    }
  }

  // 初始化目錄列表
  pages.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'menu-item';
    item.innerHTML = `<span>${p.title}</span> <span>➜</span>`;
    item.onclick = () => {
      renderPage(idx);
      toggleMenu();
    };
    menuList.appendChild(item);
  });

  renderPage(0);
</script>
</body>
</html>
